[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dr-cost-estimator-mcp"
version = "0.1.0"
description = "AWS DR Cost Estimator MCP server: exposes Disaster Recovery cost estimation tools over stdio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
authors = [
    { name = "Amazon.com, Inc. or its affiliates" },
]
dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "boto3>=1.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.100",
]

[project.scripts]
dr-cost-estimator-mcp = "dr_cost_estimator_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["dr_cost_estimator_mcp"]
